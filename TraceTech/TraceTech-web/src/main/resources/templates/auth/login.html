<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Cliente - TraceTech</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/img/tracetech-logo.ico}">
</head>
<body>

<nav th:replace="fragments/navbar :: navbar"></nav>

<div class="container" style="display:flex; justify-content:center; align-items:center; min-height:70vh;">

    <div class="card" style="max-width:420px; width:100%; text-align:center;">

        <h2>Acceso clientes</h2>
        <p class="muted">Introduce tu usuario y contraseña</p>

        <div class="flash-stack" th:if="${param.error != null or param.logout != null}">
            <div th:if="${param.error != null}" class="flash flash-error">
                Usuario o contraseña incorrectos.
            </div>

            <div th:if="${param.logout != null}" class="flash flash-success">
                Sesión cerrada correctamente.
            </div>
        </div>

        <form th:action="@{/login}" method="post" style="margin-top:15px; text-align:left;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label>Usuario</label>
            <input type="text" name="username" placeholder="usuario123" required>

            <label>Contraseña</label>
            <input type="password" name="password" placeholder="········" required>

            <button type="submit" style="width:100%; margin-top:10px;">Entrar</button>
        </form>

        <hr style="margin:18px 0; border:none; border-top:1px solid #e2e8f0;">

        <div class="auth-links">
            <a th:href="@{/register}" class="auth-link auth-link-strong">Crear cuenta</a>
            <a th:href="@{/staff/login}" class="auth-link">Acceso staff</a>
            <a th:href="@{/}" class="auth-link auth-link-muted">Volver al inicio</a>
        </div>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
