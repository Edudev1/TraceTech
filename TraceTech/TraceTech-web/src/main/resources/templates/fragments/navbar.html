<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar" class="navbar">
    <div class="nav-left">
        <a class="brand" th:href="@{/}">
            <img th:src="@{/img/tracetech-logo.png}" alt="TraceTech" class="logo">
            <span class="brand-text">TraceTech</span>
        </a>

        <a th:href="@{/tickets}"
           th:classappend="${section == 'tickets'} ? ' nav-active'">Tickets</a>

        <a th:href="@{/tickets/new}"
           th:classappend="${section == 'new-ticket'} ? ' nav-active'">Nuevo</a>

        <span th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''TECH'')')}">
            <a th:href="@{/tickets/mine}"
               th:classappend="${section == 'mine'} ? ' nav-active'">Mis asignados</a>
        </span>

        <a th:href="@{/tickets/my-created}"
           th:classappend="${section == 'my-created'} ? ' nav-active'">Mis creados</a>

        <span th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <a th:href="@{/admin/users}"
               th:classappend="${section == 'users'} ? ' nav-active'">Usuarios</a>
        </span>

        <a th:href="@{/about}"
           th:classappend="${section == 'about'} ? ' nav-active'">Sobre nosotros</a>
    </div>

    <div class="nav-right">

        <span th:if="${#authorization.expression('isAnonymous()')}" class="nav-auth">
            <a th:href="@{/login}" class="nav-btn nav-btn-primary">Login cliente</a>
            <a th:href="@{/staff/login}" class="nav-btn nav-btn-secondary">Login staff</a>
            <a th:href="@{/register}" class="nav-btn nav-btn-accent">Crear cuenta</a>
        </span>

        <div th:if="${#authorization.expression('isAuthenticated()')}" class="nav-user">

            <details class="user-menu">
                <summary class="user-pill" title="Opciones de cuenta">
                    <span th:text="${#authentication.name}">user</span>
                </summary>

                <div class="user-dropdown">
                    <a th:href="@{/account}">Mi perfil</a>
                    <a th:href="@{/account/password}">Cambiar contraseña</a>
                </div>
            </details>

            <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="logout-btn">Salir</button>
            </form>
        </div>

    </div>
</nav>

</body>
</html>
