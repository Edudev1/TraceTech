<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cambiar contraseña - TraceTech</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="icon" type="image/x-icon" th:href="@{/img/tracetech-logo.ico}">
</head>
<body>

<nav th:replace="fragments/navbar :: navbar"></nav>

<div class="container account-page">

  <div class="breadcrumb">
    <a th:href="@{/}">Inicio</a>
    <span class="breadcrumb-sep">/</span>
    <a th:href="@{/account}">Mi perfil</a>
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">Cambiar contraseña</span>
  </div>

  <div th:replace="fragments/flash :: flashMessages"></div>

  <section class="account-hero">
    <p class="account-kicker">Seguridad</p>
    <h1>Cambiar contraseña</h1>
    <p class="muted">
      Actualiza tu contraseña para mantener tu cuenta segura.
    </p>
  </section>

  <section class="account-card account-password-card">
    <form th:action="@{/account/password}"
          th:object="${passwordForm}"
          method="post"
          class="account-password-form">

      <div class="account-form-group">
        <label for="currentPassword">Contraseña actual</label>
        <input id="currentPassword" type="password" th:field="*{currentPassword}" placeholder="Tu contraseña actual">
        <div class="error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
      </div>

      <div class="account-form-group">
        <label for="newPassword">Nueva contraseña</label>
        <input id="newPassword" type="password" th:field="*{newPassword}" placeholder="Nueva contraseña">
        <div class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
      </div>

      <div class="account-form-group">
        <label for="confirmPassword">Confirmar nueva contraseña</label>
        <input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Repite la nueva contraseña">
        <div class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
      </div>

      <div class="account-password-actions">
        <button type="submit">Guardar contraseña</button>
        <a th:href="@{/account}" class="account-action-link">Cancelar</a>
      </div>
    </form>
  </section>

</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
